name: Validate the published site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install the GitHub Pages Jekyll
        run: gem install github-pages --no-document
      - name: Publication list is in step with the repository
        run: python3 final/publish.py --check
      - name: Model, pages, links, rounding, privacy, model self-tests
        run: python3 final/check.py .
      - name: The no-figures edition still builds
        run: |
          python3 privacy-site/build.py
          git diff --exit-code -- privacy-site/public
          python3 privacy-site/check.py
          python3 -m unittest discover -s privacy-site -p 'test_*.py' -v
      - name: Build the site the way GitHub Pages will
        run: jekyll build --trace
      - name: Published output is exactly the declared allowlist
        run: python3 final/check_published.py _site --allow-extra
      - name: Privacy-first public output is intact (subset)
        run: python3 privacy-site/check_published.py _site --allow-extra

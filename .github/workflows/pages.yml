name: Validate the Pages publication boundary
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install the GitHub Pages Jekyll
        run: gem install github-pages --no-document
      - name: Rebuild and check the published site and the decision model
        run: |
          python3 privacy-site/build.py
          git diff --exit-code -- privacy-site/public
          python3 final/model.py
          python3 final/phased.py
          ROOT_MODE=1 OUT_DIR=. python3 final/build.py
          git diff --exit-code -- $(grep -v '^privacy-site/' final/published.txt) final/out/model.json final/out/phased.json
          python3 privacy-site/check.py
          python3 -m unittest discover -s privacy-site -p 'test_*.py' -v
          python3 final/publish.py --check
          python3 final/check.py .
      - name: Build the site the way GitHub Pages will
        run: jekyll build --trace
      - name: Verify that Jekyll publishes exactly the reviewed allowlist
        run: |
          python3 final/check_published.py _site
          python3 privacy-site/check_published.py _site

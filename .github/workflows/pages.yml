name: Validate the published site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install GitHub Pages Jekyll
        run: gem install github-pages --no-document
      - name: Generate and check public guide
        run: |
          python3 privacy-site/build.py
          git diff --exit-code -- privacy-site/public
          python3 privacy-site/check.py
          python3 -m unittest discover -s privacy-site -p 'test_*.py' -v
      - name: Build the site as GitHub Pages does
        run: jekyll build --trace
      - name: Check exact public output
        run: python3 privacy-site/check_published.py _site

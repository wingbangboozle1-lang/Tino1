name: Validate Pages build (current edition, exact allowlist)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install GitHub Pages Jekyll
        run: gem install github-pages --no-document
      - name: Verify the current edition (repository gate, unrounded-figure scan skipped without private file)
        run: python3 final/check.py .
      - name: Build and validate isolated public site
        run: |
          jekyll build
          python3 privacy-site/check_published.py _site

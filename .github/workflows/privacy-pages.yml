name: Validate privacy-first Pages build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install GitHub Pages Jekyll
        run: gem install github-pages --no-document
      - name: Build and validate isolated public site
        run: |
          python3 privacy-site/build.py
          git diff --exit-code -- privacy-site/public
          python3 privacy-site/check.py
          jekyll build
          python3 privacy-site/check_published.py _site
